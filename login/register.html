<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <title>Daftar</title>

  <link rel="stylesheet"
  href="login.css">

</head>

<body>

<div class="login-container">

  <h2>Daftar disini</h2>

  <form id="registerForm">

    <input
    type="text"
    id="username"
    placeholder="Username yang kalcer apa ya"
    required>

    <input
    type="email"
    id="email"
    placeholder="Email kamu"
    required>

    <input
    type="password"
    id="password"
    placeholder="Password yang ngerahasia banget"
    required>

    <button type="submit" class="btn-register">
      Daftar nih
    </button>

  </form>

  <p>
    <a href="../index.html" class="back-link">Kembali ke Beranda</a>
  </p>

</div>

<script src="login.js"></script>

</body>
</html>
