<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <title>Login dulu</title>

  <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

  <h2>Login dulu yap</h2>

  <form id="loginForm">

    <input
    type="text"
    id="username"
    placeholder="Username kamu"
    required>

    <input
    type="password"
    id="password"
    placeholder="Password kamu apa"
    required>

    <button type="submit">
      Login nih
    </button>

  </form>

  <p>
    Waduh, kamu belum punya akun?
    <a href="register.html">
      Daftar dulu yuk
    </a>
  </p>

  <p>
    <a href="forgot.html">
      Gawat, aku lupa Password!
    </a>
  </p>

</div>

<script src="login.js"></script>

</body>
</html>
